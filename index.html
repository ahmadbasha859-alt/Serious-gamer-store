<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <title>SERIOUS GAMER — أرشيف الألعاب</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== خلفية متوهجة ===== -->
  <div class="bg-glow"></div>

  <!-- ===== الهيدر ===== -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">SG</div>
      <div class="brand-text">
        <h1>SERIOUS GAMER</h1>
        <p>أرشيف الألعاب</p>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع">
      <span class="theme-dot"></span>
    </button>
  </header>

  <!-- ===== شريط البحث ===== -->
  <div class="search-wrap">
    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="ابحث عن لعبة، مطوّر، أو نوع..."
      autocomplete="off"
    >
  </div>

  <!-- ===== شريط الترتيب ===== -->
  <div class="sort-bar" id="sortBar">
    <button class="sort-chip active" data-sort="newest">الأحدث</button>
    <button class="sort-chip" data-sort="rating">الأعلى تقييماً</button>
    <button class="sort-chip" data-sort="downloads">الأكثر تحميلاً</button>
    <button class="sort-chip" data-sort="title">أبجدياً</button>
  </div>

  <!-- ===== عدّاد النتائج ===== -->
  <div class="results-count" id="resultsCount"></div>

  <!-- ===== شبكة الألعاب ===== -->
  <main class="games-grid" id="gamesGrid">
    <!-- ستُضاف البطاقات هنا تلقائياً -->
  </main>

  <!-- ===== شريط التنقل السفلي ===== -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="all">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <span>الكل</span>
    </button>
    <button class="nav-btn" data-view="playing">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="5 3 19 12 5 21 5 3" stroke-linejoin="round"/>
      </svg>
      <span>قيد اللعب</span>
    </button>
    <button class="nav-btn" data-view="done">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>مكتمل</span>
    </button>
    <button class="nav-btn" data-view="fav">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.5 4.5 4.5 8.5C19 16.65 12 21 12 21z" stroke-linejoin="round"/>
      </svg>
      <span>المفضلة</span>
    </button>
  </nav>

  <!-- ===== طبقة تفاصيل اللعبة ===== -->
  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-sheet" id="detailSheet">
      <button class="detail-close" id="detailClose" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="6" y1="6" x2="18" y2="18" stroke-linecap="round"/>
          <line x1="18" y1="6" x2="6" y2="18" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="detail-cover" id="detailCover">
        <span class="detail-monogram" id="detailMonogram"></span>
      </div>

      <div class="detail-body">
        <div class="detail-header">
          <div>
            <h2 class="detail-title" id="detailTitle"></h2>
            <p class="detail-title-ar" id="detailTitleAr"></p>
          </div>
          <button class="fav-btn" id="favBtn" aria-label="مفضلة">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.5 4.5 4.5 8.5C19 16.65 12 21 12 21z" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="detail-tags">
          <span class="tag" id="detailDeveloper"></span>
          <span class="tag" id="detailGenre"></span>
          <span class="tag tag-status" id="detailStatus"></span>
        </div>

        <div class="detail-stats">
          <div class="stat">
            <span class="stat-label">التقييم</span>
            <span class="stat-value rating" id="detailRating"></span>
          </div>
          <div class="stat">
            <span class="stat-label">تاريخ الإصدار</span>
            <span class="stat-value" id="detailDate"></span>
          </div>
          <div class="stat">
            <span class="stat-label">التحميلات</span>
            <span class="stat-value downloads-value" id="detailDownloads"></span>
          </div>
          <div class="stat">
            <span class="stat-label">الحجم التقريبي</span>
            <span class="stat-value" id="detailSize"></span>
          </div>
        </div>

        <!-- حاوية روابط التحميل (تُملأ ديناميكياً) -->
        <div class="downloads-wrap" id="downloadsWrap"></div>

        <!-- ملاحظاتي -->
        <div class="detail-notes-wrap">
          <h3 class="detail-subtitle">ملاحظاتي</h3>
          <p class="detail-notes" id="detailNotes"></p>
        </div>

        <!-- التعليقات -->
        <div class="comments-wrap" id="commentsWrap">
          <h3 class="detail-subtitle">تعليقات اللاعبين</h3>
          <div class="comments-list" id="commentsList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="games.js"></script>
  <script src="script.js"></script>
</body>
</html>
